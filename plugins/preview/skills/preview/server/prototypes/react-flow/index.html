<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfG prefill statechart</title>
<script>
  // Same choices and storage key as preview pages; runs before the stylesheet to avoid a flash.
  (() => {
    const storageKey = 'preview-theme';
    const system = window.matchMedia('(prefers-color-scheme: dark)');
    let preference = 'system';
    try {
      const saved = window.localStorage.getItem(storageKey);
      if (saved === 'light' || saved === 'dark') preference = saved;
    } catch {
      // Storage may be disabled; theme selection still works on this page.
    }
    const applyTheme = () => {
      document.documentElement.dataset.theme = preference === 'system'
        ? (system.matches ? 'dark' : 'light')
        : preference;
    };
    applyTheme();
    system.addEventListener('change', applyTheme);
    document.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('theme-select');
      select.value = preference;
      select.addEventListener('change', () => {
        preference = select.value;
        applyTheme();
        try {
          if (preference === 'system') window.localStorage.removeItem(storageKey);
          else window.localStorage.setItem(storageKey, preference);
        } catch {
          // Keep the selected theme even when the browser cannot save it.
        }
      });
    });
  })();
</script>
<link rel="stylesheet" href="vendor/xyflow-react.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>InfG prefill statechart</h1>
  <label for="theme-select">Theme
    <select id="theme-select">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
</header>
<main id="diagram"></main>
<svg class="defs" aria-hidden="true" width="0" height="0">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9"
      markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z"/></marker>
  </defs>
</svg>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script>
  // The @xyflow/react UMD build expects React's automatic JSX runtime as a global; React 18 ships none.
  window.jsxRuntime = {
    Fragment: React.Fragment,
    jsx: (type, props, key) => React.createElement(type, key === undefined ? props : { ...props, key }),
  };
  window.jsxRuntime.jsxs = window.jsxRuntime.jsx;
</script>
<script src="vendor/xyflow-react.umd.js"></script>
<script src="vendor/dagre.min.js"></script>
<script src="app.js"></script>
</body>
</html>
